name: ve_wallet
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  supabase_flutter: ^2.12.4
  go_router: ^17.2.2
  fl_chart: ^1.2.0
  flutter_secure_storage: ^10.0.0
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  pdf: ^3.12.0
  csv: ^8.0.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/Logo&icon ve-wallet-remove-bg-io.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/
    - assets/icons/3d/
    - assets/logos/
    - .env.production
