<body class="min-h-screen flex flex-col items-center justify-center relative px-4 w-full max-w-[480px] mx-auto">
<!-- Top Left Back Arrow -->
<a aria-label="Go back" class="absolute top-6 left-4 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low" href="#">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</a>
<!-- Main Content Container -->
<main class="w-full flex flex-col items-center flex-1 justify-center mt-12 pb-12">
<!-- Large Illustrated Icon Container -->
<div class="w-[120px] h-[120px] rounded-[32px] bg-[#DBEAFE] flex items-center justify-center mb-8 shadow-sm">
<!-- Simulated Illustration using Material Icons for an Envelope with Key concept -->
<div class="relative">
<span class="material-symbols-outlined text-[#2563EB] text-[64px] filled">mail</span>
<div class="absolute -bottom-2 -right-2 bg-white rounded-full p-1 shadow-sm">
<span class="material-symbols-outlined text-[#2563EB] text-[24px] filled">key</span>
</div>
</div>
</div>
<!-- Typography Section -->
<h1 class="font-h2 text-h2 text-[#0F172A] mb-3 text-center w-full">Lupa Password?</h1>
<p class="font-body-sm text-body-sm text-[#64748B] text-center mb-8 max-w-[300px]">
            Masukkan email yang terdaftar. Kami akan mengirimkan link untuk reset password kamu.
        </p>
<!-- Form Section -->
<form action="#" class="w-full flex flex-col gap-6" method="POST">
<!-- Email Input Field -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#64748B]">mail</span>
</div>
<input class="w-full h-[52px] bg-[#F8FAFC] border border-outline-variant text-[#0F172A] rounded-[12px] pl-12 pr-4 font-body-md text-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none" id="email" name="email" placeholder="Contoh: nama@email.com" required="" type="email"/>
</div>
<!-- Submit Button -->
<div class="flex flex-col gap-3 w-full mt-2">
<button class="w-full h-[52px] bg-[#2563EB] hover:bg-[#1D4ED8] text-white rounded-[12px] font-label-md text-label-md transition-colors flex items-center justify-center shadow-[0_4px_12px_rgba(37,99,235,0.2)] active:scale-[0.98] duration-150" type="submit">
                    Kirim Link Reset
                </button>
<!-- Info Text -->
<p class="font-label-sm text-label-sm text-[#64748B] italic text-center w-full">
                    Cek folder spam jika email tidak masuk
                </p>
</div>
</form>
</main>
<!-- Bottom Center Back to Login Link -->
<div class="w-full flex justify-center pb-8 mt-auto">
<a class="font-label-md text-label-md text-[#2563EB] hover:text-[#1D4ED8] hover:underline transition-all flex items-center gap-1" href="#">
