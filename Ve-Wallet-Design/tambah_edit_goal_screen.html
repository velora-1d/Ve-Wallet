<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-md h-16 sticky top-0 bg-surface-container-lowest z-50">
<button aria-label="Back" class="p-sm -ml-sm text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface">Buat Target Baru</h1>
<button class="font-label-md text-label-md text-secondary-container p-sm -mr-sm">Simpan</button>
</header>
<main class="px-md max-w-[600px] mx-auto mt-sm flex flex-col gap-lg">
<!-- Live Preview Card -->
<section aria-label="Live Preview">
<div class="bg-gradient-to-br from-primary to-tertiary-container rounded-xl p-md text-on-primary shadow-[0_12px_24px_rgba(0,0,0,0.1)] flex flex-col gap-md">
<div class="flex items-center gap-md">
<div class="bg-surface-container-lowest/20 rounded-full flex items-center justify-center h-12 w-12 shrink-0">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">flight_takeoff</span>
</div>
<div class="flex-1 overflow-hidden">
<p class="font-body-sm text-body-sm opacity-80 truncate">Dana Liburan Bali</p>
<p class="font-h2 text-h2 font-bold tracking-tight truncate">Rp 15.000.000</p>
</div>
</div>
<div class="flex justify-end items-center gap-xs">
<span class="material-symbols-outlined text-[16px] opacity-80">calendar_today</span>
<span class="font-label-sm text-label-sm opacity-90">Des 2024</span>
</div>
</div>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Nama Target -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="goal-name">Nama Target</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="goal-name" placeholder="cth. Dana Liburan Bali" type="text" value="Dana Liburan Bali"/>
</div>
<!-- Target Nominal -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="goal-amount">Target Nominal</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-h3 text-h3 text-on-surface-variant">Rp</span>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant rounded-t-lg py-md pl-[52px] pr-md font-h3 text-h3 text-on-surface focus:border-primary focus:ring-0 outline-none transition-colors text-right font-semibold" id="goal-amount" type="text" value="15.000.000"/>
</div>
</div>
<!-- Deadline Picker (iOS Style Mockup) -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">Deadline</label>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl h-32 relative overflow-hidden flex">
<!-- Overlays for fade effect -->
<div class="absolute top-0 w-full h-10 bg-gradient-to-b from-surface-container-lowest to-transparent pointer-events-none z-10"></div>
<div class="absolute bottom-0 w-full h-10 bg-gradient-to-t from-surface-container-lowest to-transparent pointer-events-none z-10"></div>
<!-- Selection Indicator -->
<div class="absolute top-1/2 left-md right-md h-10 -translate-y-1/2 bg-surface-container-low rounded-lg pointer-events-none -z-0"></div>
<!-- Month Column -->
<div class="flex-1 overflow-y-auto hide-scrollbar snap-y snap-mandatory relative z-10">
<div class="h-10"></div> <!-- Padding top -->
<div class="h-10 flex items-center justify-center snap-center"><span class="font-body-md text-body-md text-on-surface-variant opacity-40">Okt</span></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-body-md text-body-md text-on-surface-variant opacity-40">Nov</span></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-h3 text-h3 text-primary font-semibold">Des</span></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-body-md text-body-md text-on-surface-variant opacity-40">Jan</span></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-body-md text-body-md text-on-surface-variant opacity-40">Feb</span></div>
<div class="h-10"></div> <!-- Padding bottom -->
</div>
<!-- Year Column -->
<div class="flex-1 overflow-y-auto hide-scrollbar snap-y snap-mandatory relative z-10">
<div class="h-10"></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-body-md text-body-md text-on-surface-variant opacity-40">2023</span></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-h3 text-h3 text-primary font-semibold">2024</span></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-body-md text-body-md text-on-surface-variant opacity-40">2025</span></div>
<div class="h-10 flex items-center justify-center snap-center"><span class="font-body-md text-body-md text-on-surface-variant opacity-40">2026</span></div>
<div class="h-10"></div>
</div>
</div>
</div>
<!-- Pilih Icon -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Pilih Icon</label>
<div class="grid grid-cols-4 gap-sm">
<button class="bg-primary text-on-primary rounded-full aspect-square flex items-center justify-center shadow-sm border-2 border-primary-fixed" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">flight_takeoff</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant rounded-full aspect-square flex items-center justify-center border border-outline-variant hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">directions_car</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant rounded-full aspect-square flex items-center justify-center border border-outline-variant hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">home</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant rounded-full aspect-square flex items-center justify-center border border-outline-variant hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">smartphone</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant rounded-full aspect-square flex items-center justify-center border border-outline-variant hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">school</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant rounded-full aspect-square flex items-center justify-center border border-outline-variant hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">diamond</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant rounded-full aspect-square flex items-center justify-center border border-outline-variant hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">favorite</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant rounded-full aspect-square flex items-center justify-center border border-outline-variant hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">redeem</span>
</button>
</div>
</div>
<!-- Pilih Warna -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Pilih Warna</label>
<div class="flex flex-wrap gap-sm">

<span class="material-symbols-outlined text-on-primary absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[20px]">check</span>

</div>
</div>

<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest p-md border-t border-outline-variant/30 z-50 shadow-[0_-4px_16px_rgba(0,0,0,0.05)] pb-safe">

<button class="w-full bg-secondary-container text-on-secondary rounded-xl py-md font-label-md text-label-md active:scale-[0.98] transition-transform shadow-sm">
                Buat Target
