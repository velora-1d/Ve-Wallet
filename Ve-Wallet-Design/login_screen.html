</div>

</div>
<!-- Password Input -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary-container text-[20px]">lock</span>
</div>

<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-background transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end w-full">
<a class="font-label-sm text-[13px] font-medium text-primary-container hover:text-primary transition-colors" href="#">
