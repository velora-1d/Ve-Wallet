<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Ve-Wallet - Kategori Kustomisasi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#dae2fd",
                        "on-error": "#ffffff",
                        "inverse-surface": "#283044",
                        "on-tertiary-fixed": "#001a41",
                        "on-tertiary-container": "#ecf0ff",
                        "on-secondary": "#ffffff",
                        "primary": "#004ac6",
                        "inverse-on-surface": "#eef0ff",
                        "on-primary-container": "#eeefff",
                        "surface": "#faf8ff",
                        "surface-container-high": "#e2e7ff",
                        "on-surface-variant": "#434655",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#131b2e",
                        "surface-dim": "#d2d9f4",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#dae2fd",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c3c6d7",
                        "inverse-primary": "#b4c5ff",
                        "surface-tint": "#0053db",
                        "secondary": "#9d4300",
                        "error": "#ba1a1a",
                        "surface-container": "#eaedff",
                        "primary-container": "#2563eb",
                        "secondary-fixed-dim": "#ffb690",
                        "tertiary-fixed-dim": "#acc7ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-surface": "#131b2e",
                        "on-secondary-fixed-variant": "#783200",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#fd761a",
                        "on-tertiary-fixed-variant": "#044491",
                        "outline": "#737686",
                        "on-secondary-fixed": "#341100",
                        "on-secondary-container": "#5c2400",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed": "#ffdbca",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-error-container": "#93000a",
                        "tertiary": "#2053a0",
                        "tertiary-container": "#3e6cba",
                        "surface-container-low": "#f2f3ff",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-bright": "#faf8ff",
                        "error-container": "#ffdad6",
                        "background": "#faf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "md": "16px",
                        "container-margin": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "gutter": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "h3": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "h2": ["Inter"],
                        "h1": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F8FAFC] text-on-background font-body-md antialiased min-h-screen flex flex-col relative md:hidden pb-32">
<!-- TopAppBar equivalent from prompt instructions -->
<header class="bg-white shadow-[0_2px_8px_rgba(0,0,0,0.06)] flex justify-between items-center w-full px-4 h-16 sticky top-0 z-40">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface">Kategori</h1>
<button aria-label="Add Category" class="w-10 h-10 flex items-center justify-center text-secondary-container hover:bg-secondary-fixed transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</header>
<!-- Tabs -->
<div class="bg-white shadow-[0_2px_8px_rgba(0,0,0,0.06)] px-4 flex space-x-8 mb-6 sticky top-16 z-30">
<button class="py-4 border-b-2 border-primary text-primary font-label-md text-label-md flex-1 text-center">Pengeluaran</button>
<button class="py-4 border-b-2 border-transparent text-outline font-label-md text-label-md flex-1 text-center hover:text-on-surface transition-colors">Pemasukan</button>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-4 space-y-lg max-w-[1200px] mx-auto w-full">
<!-- Default Categories Section -->
<section>
<h2 class="font-label-md text-label-md text-on-surface-variant mb-4 uppercase tracking-wider">Default</h2>
<div class="grid grid-cols-3 gap-4">
<!-- Category Item: Makanan (Default, Selected) -->
<div class="bg-white rounded-[16px] p-4 flex flex-col items-center justify-center shadow-[0_2px_8px_rgba(0,0,0,0.06)] border-2 border-primary relative">
<span class="material-symbols-outlined absolute top-2 right-2 text-outline-variant text-[14px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<div class="w-11 h-11 rounded-full bg-red-100 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-red-600" data-icon="restaurant">restaurant</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center truncate w-full">Makanan</span>
</div>
<!-- Category Item: Transport (Default) -->
<div class="bg-white rounded-[16px] p-4 flex flex-col items-center justify-center shadow-[0_2px_8px_rgba(0,0,0,0.06)] relative border-2 border-transparent">
<span class="material-symbols-outlined absolute top-2 right-2 text-outline-variant text-[14px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<div class="w-11 h-11 rounded-full bg-blue-100 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-blue-600" data-icon="directions_car">directions_car</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center truncate w-full">Transport</span>
</div>
<!-- Category Item: Belanja (Default) -->
<div class="bg-white rounded-[16px] p-4 flex flex-col items-center justify-center shadow-[0_2px_8px_rgba(0,0,0,0.06)] relative border-2 border-transparent">
<span class="material-symbols-outlined absolute top-2 right-2 text-outline-variant text-[14px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<div class="w-11 h-11 rounded-full bg-orange-100 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-orange-600" data-icon="shopping_bag">shopping_bag</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center truncate w-full">Belanja</span>
</div>
<!-- Category Item: Tagihan (Default) -->
<div class="bg-white rounded-[16px] p-4 flex flex-col items-center justify-center shadow-[0_2px_8px_rgba(0,0,0,0.06)] relative border-2 border-transparent">
<span class="material-symbols-outlined absolute top-2 right-2 text-outline-variant text-[14px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<div class="w-11 h-11 rounded-full bg-purple-100 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-purple-600" data-icon="receipt_long">receipt_long</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center truncate w-full">Tagihan</span>
</div>
</div>
</section>
<!-- Custom Categories Section -->
<section>
<h2 class="font-label-md text-label-md text-on-surface-variant mb-4 uppercase tracking-wider flex justify-between items-center">
<span>Kustom</span>
</h2>
<div class="grid grid-cols-3 gap-4">
<!-- Category Item: Ngopi (Custom) -->
<div class="bg-white rounded-[16px] p-4 flex flex-col items-center justify-center shadow-[0_2px_8px_rgba(0,0,0,0.06)] relative border-2 border-transparent">
<div class="absolute top-2 right-2 w-5 h-5 bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[12px]" data-icon="edit">edit</span>
</div>
<div class="w-11 h-11 rounded-full bg-amber-100 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-amber-700" data-icon="local_cafe">local_cafe</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center truncate w-full">Ngopi</span>
</div>
<!-- Category Item: Gym (Custom, Context Menu Active simulation) -->
<div class="bg-surface-container-low rounded-[16px] p-4 flex flex-col items-center justify-center shadow-[0_12px_24px_rgba(0,0,0,0.1)] relative border-2 border-transparent scale-105 transition-transform z-10">
<div class="absolute top-2 right-2 w-5 h-5 bg-white rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[12px]" data-icon="edit">edit</span>
</div>
<div class="w-11 h-11 rounded-full bg-teal-100 flex items-center justify-center mb-3 opacity-50">
<span class="material-symbols-outlined text-teal-600" data-icon="fitness_center">fitness_center</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center truncate w-full opacity-50">Gym</span>
<!-- Context Menu Overlay (Simulated Long Press) -->
<div class="absolute inset-0 bg-white/95 backdrop-blur-sm rounded-[14px] flex flex-col items-center justify-center space-y-2 p-2">
<button class="w-full flex items-center justify-center space-x-2 py-1 text-primary hover:bg-surface-container rounded-md">
<span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span>
<span class="font-label-sm text-label-sm">Edit</span>
</button>
<button class="w-full flex items-center justify-center space-x-2 py-1 text-error hover:bg-error-container rounded-md">
<span class="material-symbols-outlined text-[16px]" data-icon="delete">delete</span>
<span class="font-label-sm text-label-sm">Hapus</span>
</button>
</div>
</div>
<!-- Add New Category Placeholder -->
<button class="bg-transparent border-2 border-dashed border-outline-variant rounded-[16px] p-4 flex flex-col items-center justify-center hover:bg-surface-container-lowest transition-colors min-h-[116px]">
<span class="material-symbols-outlined text-outline-variant text-[28px] mb-2" data-icon="add">add</span>
<span class="font-label-sm text-label-sm text-outline-variant text-center w-full">Tambah</span>
</button>
</div>
</section>
</main>
<!-- Bottom Fixed Bar for Unsaved Changes -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-outline-variant p-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-50">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3.5 rounded-[12px] shadow-sm hover:bg-primary-container transition-colors">
            Simpan Perubahan
        </button>
</div>
</body></html>
