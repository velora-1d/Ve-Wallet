<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex flex-col">
<!-- App Bar -->
<header class="flex justify-between items-center w-full px-md h-16 sticky top-0 z-50 bg-surface-container-lowest border-b border-surface-variant shadow-sm transition-all duration-200">
<button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface">Edit Profil</h1>
<button class="font-label-md text-label-md text-primary relative">
            Simpan
            <span class="absolute -top-1 -right-2 w-2 h-2 bg-secondary-container rounded-full"></span>
</button>
</header>
<main class="flex-1 overflow-y-auto pb-xl">
<!-- Avatar Section -->
<section class="flex flex-col items-center pt-lg pb-md">
<div class="relative w-[88px] h-[88px]">
<img alt="Profile Avatar" class="w-full h-full rounded-full object-cover" data-alt="professional headshot of a smiling man with a neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDL-vCRk7QewjOu0poxG26_KOArQp8es8Oqc1wRwbL_s-a7wLrKOVymGvtS_Gc4bK-7kckHKm--VtroMlJEhP0ips97sGAfUud814sqqdqOdFq-9rwPJkvrYiBmhtoL5xAko1R8xjpNcDYuR_tRY73QlCcr4MlgGuDvRtvf_yd3wWRa0OaW1Swwp0awdJePDTkfG5eNgsWM2vSFVVy5xA68ckEBP4L7FE6jI6TRUrW9mbtHnVYmKJbyeMRb5ByGAIZEkg1LSwkpecKf"/>
<button class="absolute bottom-0 right-0 w-8 h-8 bg-secondary-container text-on-secondary rounded-full flex items-center justify-center shadow-md border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
</button>
</div>
<button class="mt-sm font-label-md text-label-md text-primary hover:underline">Ganti Foto Profil</button>
</section>
<!-- Form Section -->
<section class="px-md space-y-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="fullName">Nama Lengkap</label>
<input class="w-full px-sm py-[10px] bg-surface-container-lowest border border-outline rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" id="fullName" type="text" value="Alex Johnson"/>
</div>
<!-- Email Input (Disabled) -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email</label>
<div class="relative flex items-center">
<input class="w-full pl-sm pr-10 py-[10px] bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface-variant cursor-not-allowed outline-none" disabled="" id="email" type="email" value="alex.j@vewallet.com"/>
<span class="material-symbols-outlined absolute right-sm text-on-surface-variant">lock</span>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<div class="relative flex items-center">
<input class="w-full pl-sm pr-16 py-[10px] bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface-variant cursor-not-allowed outline-none" disabled="" id="password" type="password" value="••••••••"/>
<button class="absolute right-sm font-label-md text-label-md text-primary">Ubah</button>
</div>
</div>
</section>
<!-- Divider -->
<hr class="border-surface-variant my-lg mx-md"/>
<!-- Settings Rows -->
<section class="px-md space-y-sm">
<button class="w-full flex items-center justify-between p-sm bg-surface-container-lowest rounded-lg hover:bg-surface-container-low transition-colors">
<div class="flex flex-col items-start gap-xs">
<span class="font-body-md text-body-md text-on-surface">Bahasa Aplikasi</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Indonesia</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-sm bg-surface-container-lowest rounded-lg hover:bg-surface-container-low transition-colors">
<div class="flex flex-col items-start gap-xs">
<span class="font-body-md text-body-md text-on-surface">Mata Uang</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">IDR - Rupiah</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
</section>
</main>
<!-- Bottom Action Button -->
<div class="p-md bg-surface-container-lowest border-t border-surface-variant shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
<button class="w-full py-3 bg-primary text-on-primary font-label-md text-label-md rounded-xl hover:bg-primary-fixed-variant transition-colors shadow-sm">
            Simpan Perubahan
        </button>
</div>
