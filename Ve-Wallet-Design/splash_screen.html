<!-- Logo Mark Container -->
<div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-[0_12px_24px_rgba(0,0,0,0.15)] mb-lg">

<span class="material-symbols-outlined text-[48px] text-primary-container" data-icon="account_balance_wallet" data-weight="fill">account_balance_wallet</span>
</div>
<!-- App Name Anchor -->
<h1 class="font-h1 text-h1 text-white mb-xs">Ve-Wallet</h1>
<!-- Tagline -->
<p class="font-body-sm text-body-sm text-white/60">Kelola Keuangan Bersama</p>
</main>

<!-- Note: Animation is suppressed per strict rules; utilizing opacity stepping to imply a loading state -->

<div class="w-2 h-2 rounded-full bg-white opacity-100"></div>
<div class="w-2 h-2 rounded-full bg-white opacity-60"></div>
<div class="w-2 h-2 rounded-full bg-white opacity-30"></div>
