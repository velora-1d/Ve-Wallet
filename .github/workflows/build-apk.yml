name: build-apk

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env.production file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          touch .env.production
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env.production
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env.production

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug --verbose

      - name: Build APK Release
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          flutter build apk --release --split-per-abi --verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-*-release.apk
